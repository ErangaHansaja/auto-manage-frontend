<div class="modal-overlay" (click)="onClose()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="form-container">
            <div class="form-header">
                <h3>Create Customer Account</h3>
                <p>Enter customer details below to generate a new service profile.</p>
            </div>

            <form class="customer-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Name <span class="required">*</span></label>
                        <input type="text" class="form-control" />
                    </div>
                    <div class="form-group">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" class="form-control" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>NIC <span class="required">*</span></label>
                        <input type="text" class="form-control" />
                    </div>
                    <div class="form-group">
                        <label>Mobile Number <span class="required">*</span></label>
                        <input type="tel" class="form-control" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group full-width">
                        <label>Address <span class="required">*</span></label>
                        <input type="text" class="form-control" />
                    </div>
                </div>

                <div class="form-row toggle-row">
                    <label>Account Status</label>
                    <div class="toggle-container">
                        <label class="switch">
                            <input type="checkbox" checked>
                            <span class="slider round"></span>
                        </label>
                        <span class="status-text">Active</span>
                    </div>
                </div>

                <div class="form-actions">
                    <div class="action-row">
                        <button type="button" class="btn btn-outline" (click)="onClose()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create account</button>
                    </div>
                    <div class="secondary-action">
                        <button type="button" class="btn btn-primary btn-vehicle">Add Vehicle Details</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
