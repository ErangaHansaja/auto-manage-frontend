<div class="page-container">
    <div class="page-header">
        <h2>Vehicles</h2>
    </div>

    <div class="content-wrapper">
        <div class="section-title">
            <h3>Vehicle List</h3>
            <p>Manage your vehicles below.</p>
        </div>

        <div class="search-card">
            <div class="search-controls" style="justify-content: space-between;">
                <div class="search-input-group">
                    <input type="text" placeholder="Search vehicle..">
                    <span class="material-icons-outlined search-icon">search</span>
                </div>
                <button class="btn btn-primary" (click)="openDialog()" style="flex: unset; width: auto;">+ Add Vehicle</button>
            </div>
        </div>

        <div class="table-card">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th class="col-name">Vehicle Name</th>
                            <th class="col-model">Model</th>
                            <th class="col-plate">Plate Number</th>
                            <th class="col-status">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let vehicle of vehicles">
                            <td>{{vehicle.name}}</td>
                            <td>{{vehicle.model}}</td>
                            <td>{{vehicle.plate}}</td>
                            <td>{{vehicle.status}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
