<div class="modal-overlay" (click)="onClose()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="form-container">
            <div class="form-header">
                <h3>Add Service</h3>
                <p>Enter details below to create a new service record.</p>
            </div>

            <form class="service-form" [formGroup]="serviceForm" (ngSubmit)="onSubmit()">

                <div class="form-row">
                    <div class="form-group">
                        <label>Customer Name <span class="required">*</span></label>
                        <input type="text" class="form-control" formControlName="customer_name"
                            placeholder="e.g. John Silva" />
                        <div class="field-error" *ngIf="f['customer_name'].touched && f['customer_name'].errors?.['required']">
                            Customer name is required
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Mechanic <span class="required">*</span></label>
                        <input type="text" class="form-control" formControlName="mechanic"
                            placeholder="e.g. Kasun Perera" />
                        <div class="field-error" *ngIf="f['mechanic'].touched && f['mechanic'].errors?.['required']">
                            Mechanic is required
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>License Plate <span class="required">*</span></label>
                        <input type="text" class="form-control" formControlName="license_plate"
                            placeholder="e.g. CAB-1234" />
                        <div class="field-error" *ngIf="f['license_plate'].touched && f['license_plate'].errors?.['required']">
                            License plate is required
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Vehicle Model <span class="required">*</span></label>
                        <input type="text" class="form-control" formControlName="vehicle_model"
                            placeholder="e.g. Toyota Corolla" />
                        <div class="field-error" *ngIf="f['vehicle_model'].touched && f['vehicle_model'].errors?.['required']">
                            Vehicle model is required
                        </div>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label>Customer Request <span class="required">*</span></label>
                    <textarea class="form-control" formControlName="customer_request" rows="3"
                        style="resize: vertical;" placeholder="Describe the issue or requested service..."></textarea>
                    <div class="field-error" *ngIf="f['customer_request'].touched && f['customer_request'].errors?.['required']">
                        Customer request is required
                    </div>
                </div>

                @if (errorMessage) {
                    <div class="submit-error">{{ errorMessage }}</div>
                }

                <div class="form-actions">
                    <div class="action-row">
                        <button type="button" class="btn btn-outline" (click)="onClose()">Cancel</button>
                        <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
                            {{ isSubmitting ? 'Saving...' : 'Add Service' }}
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
