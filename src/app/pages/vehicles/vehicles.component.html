<div class="page-container">
    <div class="page-header">
        <h2>Vehicles</h2>
    </div>

    <div class="content-wrapper">
        <div class="section-title">
            <h3>Vehicle List</h3>
            <p>Manage your vehicles below.</p>
        </div>

        <div class="search-card">
            <div class="search-controls" style="justify-content: space-between;">
                <div class="search-input-group">
                    <input type="text" placeholder="Search vehicle..">
                    <span class="material-icons-outlined search-icon">search</span>
                </div>
                <button class="btn btn-primary" (click)="openDialog()" style="flex: unset; width: auto;">+ Add Vehicle</button>
            </div>
        </div>

        <div class="table-card">
            <div class="table-scroll">
                <div class="state-msg" *ngIf="isLoading">Loading vehicles...</div>
                <div class="state-msg error-msg" *ngIf="errorMessage && !isLoading">{{errorMessage}}</div>
                <table *ngIf="!isLoading && !errorMessage">
                    <thead>
                        <tr>
                            <th>Vehicle Name</th>
                            <th>Model</th>
                            <th>Plate Number</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let vehicle of vehicles">
                            <td>{{vehicle.name}}</td>
                            <td>{{vehicle.model}}</td>
                            <td>{{vehicle.license_plate}}</td>
                            <td>
                                <span [class]="vehicle.is_active ? 'badge-active' : 'badge-inactive'">
                                    {{vehicle.is_active ? 'Active' : 'Inactive'}}
                                </span>
                            </td>
                        </tr>
                        <tr *ngIf="vehicles.length === 0">
                            <td colspan="4" class="state-msg">No vehicles found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<app-vehicle-dialog *ngIf="showDialog" (closeDialog)="closeDialog()"></app-vehicle-dialog>
