<div class="modal-overlay" (click)="onClose()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="form-container">
            <div class="form-header">
                <h3>Add Service</h3>
                <p>Enter details below to create a new service record.</p>
            </div>

            <form class="service-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Customer Name <span class="required">*</span></label>
                        <input type="text" class="form-control" />
                    </div>
                    <div class="form-group">
                        <label>License Plate Number <span class="required">*</span></label>
                        <input type="text" class="form-control" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Vehicle Manufacturer <span class="required">*</span></label>
                        <input type="text" class="form-control" />
                    </div>
                    <div class="form-group">
                        <label>Vehicle Model <span class="required">*</span></label>
                        <input type="text" class="form-control" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Vehicle Year <span class="required">*</span></label>
                        <input type="number" class="form-control" />
                    </div>
                    <div class="form-group">
                        <label>Customer Complaint <span class="required">*</span></label>
                        <textarea class="form-control" rows="2" style="resize: vertical;"></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <div class="action-row">
                        <button type="button" class="btn btn-outline" (click)="onClose()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Add Service</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
