<div class="page-container">
    <div class="page-header">
        <h2>Customers</h2>
    </div>

    <div class="content-wrapper">
        <div class="section-title">
            <h3>Customer List</h3>
            <p>Manage your customers and their profiles.</p>
        </div>

        <div class="search-card">
            <div class="search-controls" style="justify-content: space-between;">
                <div class="search-input-group">
                    <input type="text" placeholder="Search customer..">
                    <span class="material-icons-outlined search-icon">search</span>
                </div>
                <button class="btn btn-primary" (click)="openDialog()" style="flex: unset; width: auto;">+ Add Customer</button>
            </div>
        </div>

        <div class="table-card">
            <div class="table-scroll">
                <div class="state-msg" *ngIf="isLoading">Loading customers...</div>
                <div class="state-msg error-msg" *ngIf="errorMessage && !isLoading">{{errorMessage}}</div>
                <table *ngIf="!isLoading && !errorMessage">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Mobile Number</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let customer of customers">
                            <td>{{customer.name}}</td>
                            <td>{{customer.email}}</td>
                            <td>{{customer.mobile}}</td>
                            <td>
                                <span [class]="customer.is_active ? 'badge-active' : 'badge-inactive'">
                                    {{customer.is_active ? 'Active' : 'Inactive'}}
                                </span>
                            </td>
                        </tr>
                        <tr *ngIf="customers.length === 0">
                            <td colspan="4" class="state-msg">No customers found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<app-customer-dialog *ngIf="showDialog" (closeDialog)="closeDialog()"></app-customer-dialog>
